name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Релиз без пуша тега: Actions → Build → Run workflow → release = true.
  # Тег v<версия из pubspec.yaml> создаётся вместе с релизом.
  workflow_dispatch:
    inputs:
      release:
        description: "Выпустить релиз (тег v<версия из pubspec.yaml>)"
        type: boolean
        default: false

# Новый push в ту же ветку отменяет недоделанную сборку предыдущего.
concurrency:
  # Ручной релиз — своя группа: push в ту же ветку не должен его отменить.
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: "3.47.7"
  # Сборка для релиза: пуш тега v* или ручной запуск с release = true.
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter tests
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Core tests
        working-directory: core
        run: go test -ldflags=-checklinkname=0 ./...

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Релиз с временным debug-ключом нельзя будет обновить следующей версией
      # (Android требует ту же подпись), поэтому без постоянного ключа тег не собираем.
      - name: Require release key for tags
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: test -n "$KEYSTORE_BASE64" || { echo "Нет секрета ANDROID_KEYSTORE_BASE64 — релизный APK не будет обновляемым"; exit 1; }

      - name: Build APK
        env:
          SRU_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          SRU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SRU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SRU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_NDK_HOME" || { echo "нет Android NDK — armv7 не соберётся"; exit 1; }
          flutter build apk --release --target-platform android-arm,android-arm64
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/libsrucore.so'
          test "$(unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -c 'libsrucore.so')" = 2
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SruNaZapret-android.apk

      # Сборки веток — артефактом на 3 дня: бесплатные 500 МБ приватного
      # репозитория кончаются за несколько сборок при 90-дневном хранении.
      - uses: actions/upload-artifact@v4
        if: env.IS_RELEASE != 'true'
        # Кончилось место под артефакты — сборка всё равно считается удачной.
        continue-on-error: true
        with:
          name: SruNaZapret-android
          path: dist/*
          retention-days: 3

      # Тег — файлы сразу в релиз (место под релизы в квоту артефактов не входит).
      - name: Release tag
        if: env.IS_RELEASE == 'true'
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else echo "name=v$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@v2
        if: env.IS_RELEASE == 'true'
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: SruNaZapret ${{ steps.tag.outputs.name }}
          files: dist/*
          prerelease: true

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Core (sru-core.exe + geo)
        shell: bash
        run: core/build_desktop.sh windows

      - name: Core tests
        working-directory: core
        run: go test ./...

      - name: Build app
        run: flutter build windows --release

      - name: Bundle VC++ runtime
        # Чтобы приложение запускалось на чистой Windows 10 без Visual C++ Redistributable.
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" $rel
          }
          if (!(Test-Path "$rel\sru-core.exe")) { throw "sru-core.exe не попал в сборку" }
          if (!(Test-Path "$rel\wintun.dll")) { throw "wintun.dll не попал в сборку (режим TUN)" }

      - name: Zip and installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\SruNaZapret-windows-x64-portable.zip
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" windows\installer\SruNaZapret.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с кодом $LASTEXITCODE" }
          Copy-Item build\installer\SruNaZapret-Setup-*.exe dist\

      # Сборки веток — артефактом на 3 дня: бесплатные 500 МБ приватного
      # репозитория кончаются за несколько сборок при 90-дневном хранении.
      - uses: actions/upload-artifact@v4
        if: env.IS_RELEASE != 'true'
        # Кончилось место под артефакты — сборка всё равно считается удачной.
        continue-on-error: true
        with:
          name: SruNaZapret-windows
          path: dist/*
          retention-days: 3

      # Тег — файлы сразу в релиз (место под релизы в квоту артефактов не входит).
      - name: Release tag
        if: env.IS_RELEASE == 'true'
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else echo "name=v$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@v2
        if: env.IS_RELEASE == 'true'
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: SruNaZapret ${{ steps.tag.outputs.name }}
          files: dist/*
          prerelease: true
